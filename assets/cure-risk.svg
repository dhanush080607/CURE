<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">CURE Risk Engine</title>
  <desc id="desc">Tank level, consumption history, and forecast temperature feed the CURE risk engine to estimate water runway and classify risk as low, watch, or high.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071426"/><stop offset="1" stop-color="#0c2037"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/></marker>
    <style>
      .heading{font:700 31px Arial,sans-serif;fill:#e6f7ff;letter-spacing:1px}.sub{font:400 15px Arial,sans-serif;fill:#91b5c9}.label{font:700 17px Arial,sans-serif;fill:#e6f7ff}.small{font:400 14px Arial,sans-serif;fill:#a8c5d5}.tiny{font:700 12px Arial,sans-serif;fill:#a8c5d5;letter-spacing:1.4px}.node{fill:#10283e;stroke:#1d526b;stroke-width:1.5}.line{fill:none;stroke:#22d3ee;stroke-width:2.2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="560" rx="28" fill="url(#bg)"/><circle cx="1080" cy="65" r="120" fill="#0e7490" opacity=".10"/><circle cx="80" cy="520" r="140" fill="#0891b2" opacity=".08"/>
  <path d="M32 90 H1168" stroke="#17435b"/><text x="60" y="54" class="tiny">CLIMATE &amp; UTILITY RISK ENGINE</text><text x="60" y="91" class="heading">CURE RISK ENGINE</text><text x="60" y="119" class="sub">From climate and usage signals to an actionable water-supply estimate</text>
  <rect x="60" y="165" width="270" height="74" rx="14" class="node"/><circle cx="91" cy="202" r="17" fill="#164e63"/><path d="M91 188 C84 198 82 202 82 207 A9 9 0 0 0 100 207 C100 202 98 198 91 188Z" fill="#67e8f9"/><text x="120" y="195" class="label">Tank availability</text><text x="120" y="218" class="small">Capacity × current level</text>
  <rect x="60" y="258" width="270" height="74" rx="14" class="node"/><circle cx="91" cy="295" r="17" fill="#164e63"/><path d="M82 301 L88 294 L93 298 L101 286" fill="none" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="288" class="label">Consumption history</text><text x="120" y="311" class="small">Recent usage + trend</text>
  <rect x="60" y="351" width="270" height="74" rx="14" class="node"/><circle cx="91" cy="388" r="17" fill="#164e63"/><path d="M91 374 L91 390 M84 383 L91 390 L98 383" fill="none" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="381" class="label">Weather &amp; heat</text><text x="120" y="404" class="small">Forecast temperature</text>
  <path d="M330 202 H386 V277 H425 M330 295 H425 M330 388 H386 V313 H425" class="line"/>
  <rect x="430" y="210" width="310" height="170" rx="20" fill="#0b3147" stroke="#22d3ee" stroke-width="2"/><rect x="451" y="232" width="268" height="34" rx="8" fill="url(#cyan)" opacity=".16"/><text x="585" y="254" text-anchor="middle" class="tiny" fill="#67e8f9">DETERMINISTIC CALCULATION</text><text x="585" y="294" text-anchor="middle" class="heading" style="font-size:24px">Risk Engine</text><text x="585" y="323" text-anchor="middle" class="small">Projected daily consumption</text><text x="585" y="346" text-anchor="middle" class="small">Available water ÷ daily demand</text><text x="585" y="365" text-anchor="middle" class="small">Runway + risk classification</text>
  <path d="M740 295 H775 V203 H795 M775 295 H795 M775 295 V388 H795" class="line"/>
  <rect x="795" y="165" width="345" height="76" rx="14" class="node"/><circle cx="829" cy="203" r="17" fill="#164e63"/><path d="M820 204 H838 M829 194 V212" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round"/><text x="860" y="196" class="label">Water runway</text><text x="860" y="219" class="small">Estimated days of supply left</text>
  <rect x="795" y="258" width="345" height="74" rx="14" class="node"/><text x="820" y="287" class="label">Risk classification</text><rect x="820" y="299" width="78" height="22" rx="11" fill="#14532d"/><text x="859" y="314" text-anchor="middle" style="font:700 11px Arial;fill:#86efac">LOW</text><rect x="908" y="299" width="84" height="22" rx="11" fill="#713f12"/><text x="950" y="314" text-anchor="middle" style="font:700 11px Arial;fill:#fde68a">WATCH</text><rect x="1002" y="299" width="82" height="22" rx="11" fill="#7f1d1d"/><text x="1043" y="314" text-anchor="middle" style="font:700 11px Arial;fill:#fecaca">HIGH</text>
  <rect x="795" y="351" width="345" height="74" rx="14" class="node"/><circle cx="829" cy="388" r="17" fill="#164e63"/><path d="M821 388 L827 394 L838 381" fill="none" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="860" y="381" class="label">Recommended action</text><text x="860" y="404" class="small">Monitor, review, or replenish</text>
  <path d="M60 463 H1140" stroke="#17435b"/><text x="60" y="494" class="tiny">DESIGN PRINCIPLE</text><text x="60" y="522" style="font:700 20px Arial,sans-serif;fill:#67e8f9">The risk engine calculates. AI explains.</text><text x="1140" y="522" text-anchor="end" class="small">Illustrative MVP model</text>
</svg>
